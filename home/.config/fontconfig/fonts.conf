<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
   <!-- Intercept Firefox's internal layout queries -->
    <match target="pattern">
        <test qual="any" name="family"><string>-moz-default</string></test>
        <edit mode="prepend" name="family"><string>Noto Sans</string></edit>
    </match>

    <!-- Prevent system-ui calls from failing back to monospace -->
    <match target="pattern">
        <test qual="any" name="family"><string>system-ui</string></test>
        <edit mode="prepend" name="family"><string>Noto Sans</string></edit>
    </match>
	<match target="font">
		<edit mode="assign" name="antialias">
			<bool>true</bool>
		</edit>
		<edit mode="assign" name="embeddedbitmap">
			<bool>false</bool>
		</edit>
		<edit mode="assign" name="hinting">
			<bool>true</bool>
		</edit>
		<edit mode="assign" name="hintstyle">
			<const>hintslight</const>
		</edit>
		<edit mode="assign" name="lcdfilter">
			<const>lcddefault</const>
		</edit>
		<edit mode="assign" name="rgba">
			<const>rgb</const>
		</edit>
	</match>
</fontconfig>
